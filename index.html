<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>currency converyter</title>
    <link rel="stylesheet" href="./currency converyter.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>

<body>
    <div class="container">
        <h2>Currency Converyter</h2>

        <form action="">
            <div class="amount">
                <input type="text" value="1">
            </div>
            <div class="dropdown">
                <div class="from">
                    <p>Form</p>
                    <div class="select-container">
                        <img src="https://flagsapi.com/BE/flat/64.png" alt="">
                        <select name="from">
                        </select>
                    </div>
                </div>
                <i id="swapbtn" class="fa-solid fa-arrow-right-arrow-left"></i>
                <div class="to">
                    <p>TO</p>
                    <div class="select-container">
                        <img src="https://flagsapi.com/IN/flat/64.png" alt="">
                        <select name="to">
                        </select>
                    </div>
                </div>
                <div class="msg">1USD = 80 INR</div>
                <button>Get Exchange Rate</button>
        </form>

    </div>


    <script src="./codes.js"></script>
    <script src="./currency converyter.js"></script>
    
</body>

</html>
